name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ------------------------------------------------------------------
  # JOB 1 : BACKEND (Optimisé avec UV)
  # ------------------------------------------------------------------
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # INSTALLATION DE UV (Remplaçant de PIP ultra-rapide)
    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh

    - name: Install Dependencies (via uv)
      run: |
        # On active uv
        source $HOME/.cargo/env
        
        # Installation ultra-rapide du socle lourd
        # --system permet d'installer dans l'environnement global du runner (plus simple pour la CI)
        uv pip install --system -r requirements-core.txt
        uv pip install --system -r requirements.txt
        
        # Installation Spacy FR (Direct URL)
        uv pip install --system https://github.com/explosion/spacy-models/releases/download/fr_core_news_lg-3.7.0/fr_core_news_lg-3.7.0.tar.gz

    - name: Run Unit Tests
      env:
        # Variables fantômes pour éviter le crash au démarrage
        POSTGRES_USER: "test"
        POSTGRES_PASSWORD: "test"
        POSTGRES_DB: "test_db"
        NEO4J_URI: "bolt://localhost:7687"
        NEO4J_USERNAME: "neo4j"
        NEO4J_PASSWORD: "password"
        GOOGLE_API_KEY: "dummy"
        GROQ_API_KEY: "dummy"
        LLM_PROVIDER: "google"
        LLM_MODEL_NAME: "gemini-1.5-flash"
      run: |
        # On lance les tests
        pytest tests/test_core.py -v

  # ------------------------------------------------------------------
  # JOB 2 : FRONTEND (Sécurisé)
  # ------------------------------------------------------------------
  check-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend-next

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        # On retire le cache ici temporairement pour éviter l'erreur si le fichier manque encore
        # cache: 'npm' 

    - name: Install dependencies
      # Stratégie robuste : Si package-lock existe, on fait 'ci', sinon 'install'
      run: |
        if [ -f "package-lock.json" ]; then
          npm ci
        else
          echo "⚠️ Pas de package-lock.json trouvé, utilisation de npm install classique"
          npm install
        fi

    - name: Linting
      # On continue même s'il y a des warnings mineurs de linting
      continue-on-error: true
      run: npm run lint
      
    - name: Build Check
      run: npm run build