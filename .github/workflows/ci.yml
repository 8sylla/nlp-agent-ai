name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # JOB 1 : TESTER LE BACKEND (PYTHON)
  test-backend:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    # On met en cache en surveillant les DEUX fichiers de requirements
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements-core.txt', 'backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        
        # 1. Installer le SOCLE LOURD (IA, LangChain, Neo4j drivers)
        pip install -r requirements-core.txt
        
        # 2. Installer le SOCLE LÉGER (FastAPI, Tests)
        pip install -r requirements.txt
        
        # 3. Installer le modèle Spacy Français (Lien direct pour éviter les erreurs)
        pip install https://github.com/explosion/spacy-models/releases/download/fr_core_news_lg-3.7.0/fr_core_news_lg-3.7.0.tar.gz

    - name: Run Unit Tests
      # On injecte des fausses variables d'env pour éviter que le code ne plante au démarrage
      # (Même si on ne connecte pas la vraie DB, le code a besoin que la variable existe)
      env:
        POSTGRES_USER: "test"
        POSTGRES_PASSWORD: "test"
        POSTGRES_DB: "test_db"
        NEO4J_URI: "bolt://localhost:7687"
        NEO4J_USERNAME: "neo4j"
        NEO4J_PASSWORD: "password"
        GOOGLE_API_KEY: "dummy_key_for_ci"
        GROQ_API_KEY: "dummy_key_for_ci"
        LLM_PROVIDER: "google"
      run: |
        # On lance le nouveau fichier de test (test_core.py)
        pytest tests/test_core.py -v

  # JOB 2 : VÉRIFIER LE FRONTEND (NEXT.JS)
  check-frontend:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend-next

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend-next/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Linting (Qualité du code)
      run: npm run lint
      
    - name: Build Check (Vérifier que ça compile)
      run: npm run build
